<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gama CF Dashboard - MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <h1>GAMA <span>CF</span></h1>
            <span class="badge">MVP Simulator</span>
        </div>
        <div class="actions">
            <button id="btn-start-class" class="btn btn-primary">Iniciar Aula</button>
            <button id="btn-end-class" class="btn btn-danger hidden">Encerrar Aula</button>
        </div>
    </header>

    <main class="dashboard" id="dashboard-grid">
        <!-- Student cards will be injected here via JS -->
        <div class="empty-state">
            <p>Nenhuma aula em andamento.</p>
            <p>Clique em <strong>Iniciar Aula</strong> para adicionar alunos.</p>
        </div>
    </main>

    <!-- Modal for Class Setup -->
    <div id="setup-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Configurar Aula</h2>
            <p>Vincule os alunos às pulseiras (simuladas).</p>
            
            <form id="setup-form">
                <div class="form-group">
                    <label>Aluno 1</label>
                    <div class="input-row">
                        <input type="text" id="student-1-name" placeholder="Nome do Aluno" required>
                        <input type="text" value="Pulseira #1" disabled class="band-input">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Aluno 2</label>
                    <div class="input-row">
                        <input type="text" id="student-2-name" placeholder="Nome do Aluno">
                        <input type="text" value="Pulseira #2" disabled class="band-input">
                    </div>
                </div>

                <div class="form-group">
                    <label>Aluno 3</label>
                    <div class="input-row">
                        <input type="text" id="student-3-name" placeholder="Nome do Aluno">
                        <input type="text" value="Pulseira #3" disabled class="band-input">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancel-setup" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Começar Treino</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
